<ion-header>
	<ion-toolbar>
		<ion-buttons start>
			<button ion-button (click)="dismiss()">Cancel</button>
		</ion-buttons>

		<ion-title>
			Filter Recent Activities
		</ion-title>

		<ion-buttons end>
			<button ion-button (click)="applyFilters()" strong>Done</button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>

<ion-content class="outer-content">

	<ion-list>

		<ion-item>
				<span [style.background-color]="'red'" item-start class="dot"></span>
				<ion-label>Toggle All Filters</ion-label>
				<ion-toggle [(ngModel)]="toggleAll" color="secondary"></ion-toggle>
		</ion-item>

	</ion-list>

	<ion-list>
		<ion-list-header>Recent Activity Types</ion-list-header>

		<ion-item *ngFor="let rat of recentActivityTypesArray">
			<span [style.background-color]="rat.color" item-start class="dot"></span>
			<ion-label>{{ rat.recentActivityTypeName }}</ion-label>
			<ion-toggle
				[(ngModel)]="rat.status"
				color="secondary"
			></ion-toggle>
		</ion-item>
	</ion-list>

</ion-content>
