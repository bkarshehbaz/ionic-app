<ion-header>
    <ion-navbar color="primary">
        <ion-buttons left>
            <button ion-button menuToggle>
                <ion-icon name="menu"></ion-icon>
            </button>
        </ion-buttons>

		<ion-title>
			<!-- Recent Activities -->
            <img style="width: 40px; vertical-align: middle;" src="/assets/navbar_logo.png"/>
		</ion-title>

        <ion-buttons right>
            <button class="search-button" (click)="vvsApp.presentSearchModal()" ion-button>
                <ion-icon name="search"></ion-icon>
            </button>
        </ion-buttons>

    </ion-navbar>

    <ion-toolbar class="filter-stripe" no-padding>
		<ion-grid no-padding>

			<ion-row no-padding>

				<ion-col col-vvs no-margin>
					<button (click)="openFilter()" icon-only ion-button>
						<ion-icon name="ios-options-outline"></ion-icon>
					</button>
				</ion-col>

				<ion-col no-padding no-margin>
					<ion-grid no-padding>
						<ion-scroll scrollX="true">
							<ion-row nowrap>
								<ion-col no-padding no-margin *ngFor="let rat of recentActivityTypesArray">
									<button [style.background-color]="rat.color"
											[ngClass]="{'not-selected' : rat?.status == false }"
											(click)="toggleType(rat)" small ion-button>
										<ion-icon [name]=" rat?.status ? 'ios-checkbox-outline' : 'ios-square-outline' "></ion-icon>
										{{ rat.recentActivityTypeNameWithCount }}
									</button>
								</ion-col>
							</ion-row>
						</ion-scroll>
					</ion-grid>
				</ion-col>

			</ion-row>

		</ion-grid>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div>

		<ion-list *ngIf="pageActive === true">
			<ion-item-group *ngFor="let group of groups;let i=index;">

				<!-- <ion-item-divider [ngClass]="group?.max > myLimit ? 'hidden' : ''"  sticky> -->
				<ion-item-divider *ngIf="group?.time != 'Today'" [class.hidden]="group.shownCount == 0" sticky>
					<!-- <ion-label [innerHTML]="group?.time + ' max: ' + group?.max + ' limit: ' + myLimit"></ion-label> -->
					<ion-label [innerHTML]="group?.time"></ion-label>
				</ion-item-divider>

				<recent-activity-item [recentActivities]="group.recentActivities"
									  [min]="group.min"
									  [max]="group.max"
									  [myLimit]="myLimit"
									  [noOptions]="true"
									  (onOptionClickEvent)="presentSelectPopover($event)">
				</recent-activity-item>

			</ion-item-group>
		</ion-list>

		<ion-infinite-scroll [enabled]="myLimit <= recentActivityCount" (ionInfinite)="doInfinite($event)">
			<ion-infinite-scroll-content></ion-infinite-scroll-content>
		</ion-infinite-scroll>

    </div>
</ion-content>
