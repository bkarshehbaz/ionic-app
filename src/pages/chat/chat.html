<ion-header>
    <ion-navbar [color]="'primary'">

        <button ion-button menuToggle>
            <ion-icon name="menu"></ion-icon>
		</button>

		<ion-title>
			<!-- {{title}} -->
            <img style="width: 40px; vertical-align: middle;" src="/assets/navbar_logo.png"/>
		</ion-title>

        <ion-buttons right>
            <button class="search-button" (click)="vvsApp.presentSearchModal()" ion-button icon-only>
                <ion-icon name="search"></ion-icon>
            </button>
        </ion-buttons>

    </ion-navbar>
</ion-header>

<!-- [class.photos-opened]="newMessage?.msgImage?.length" -->
<ion-content #content fixed [scrollDownOnLoad]="false"
             (click)="contentMouseDown($event)"
             ionScrollEnd="hideKeyboard();">

    <!-- <ion-infinite-scroll *ngIf="isIonInfiniteEnabled && groups"
						 threshold="90%" position="top"
                         [enabled]="chatMessageLimit <= messages?.length && _contentMouseDown == true"
                         (ionInfinite)="doInfinite($event)">
        <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll> -->

	<ion-list class="chat-list">
		<ion-item-group class="group">
			<!-- <span *ngIf="group.range.min < chatMessageLimit;"> -->

			<span *ngFor="let message of messages; let i = index; trackBy:trackById">
				<ion-item-divider *ngIf="message.dividerDate" sticky>
					<ion-label [innerHTML]="message.dividerDate"></ion-label>
				</ion-item-divider>

				<ion-item *ngIf="!message.type">
					<chat-bubble
						(retry)="retry($event)"
						[classToUse]="message?.userID != vvsApp?.userID ? 'left' : 'right'"
						[message]="message">
					</chat-bubble>
				</ion-item>

			</span>

        </ion-item-group>
    </ion-list>

</ion-content>

<!-- <ion-footer #ionFooter (touchstart)="footerTouchStart($event)"> -->
<ion-footer #ionFooter [keyboardAttach]="content" (touchstart)="footerTouchStart($event)">
    <ion-toolbar>

		<!-- <span class="picture-footer">
			<ion-grid style="margin-left: -40px;" *ngIf="newMessage?.msgImage.length > 0">
				<ion-row>
					<photos-row [showRemoveButton]="true"
								[config]="{ 'images' : newMessage.msgImage, class: 'chat-camera' }">
					</photos-row>
				</ion-row>
			</ion-grid>
		</span> -->

     	<ion-buttons left align-self-end>
			<button ion-button large icon-only
					class="footer-action camera-button"
					(click)="touchTakePicture($event)"
					(touchstart)="touchTakePicture($event)">
				<!-- (touchstart)="touchTakePicture($event)"> -->
				<ion-icon name="camera"></ion-icon>
			</button>
		</ion-buttons>

		<div>
			<photos-row #photosRow [showRemoveButton]="true" *ngIf="newMessage?.msgImage?.length > 0"
						[config]="{ 'images' : newMessage.msgImage, class: 'chat-camera' }">
			</photos-row>
			<textarea spellcheck="true"
					#textArea
					autoComplete="true"
					autocorrect="true"
					rows="1"
					[autoResizeTextarea]="resizeTextarea"
					class="chat-input"
					[class.textarea-with-photos]="newMessage?.msgImage?.length > 0"
					[formControl]="msgContent"
					placeholder="Text Message">
			</textarea>
		</div>

		<ion-buttons right align-self-end style="position:absolute;right:5px;bottom:12px;">
			<button ion-button large round
					[disabled]="msgContent.invalid"
					(click)="touchSendButton($event)"
					class="footer-action send-button"
					(touchstart)="touchSendButton($event)">
					<ion-icon name="md-arrow-round-up"></ion-icon>
			</button>
		</ion-buttons>

      <!-- <ion-buttons right align-self-end>
		  <button ion-button large round
					[disabled]="newMessage?.msgContent?.length <= 0 && newMessage?.msgImage?.length == 0"
					(click)="touchSendButton($event)"
					class="footer-action send-button"
					(touchstart)="touchSendButton($event)">
					<ion-icon name="md-arrow-round-up"></ion-icon>
			</button>
      </ion-buttons> -->



    </ion-toolbar>
</ion-footer>
