<ion-header>
	<ion-navbar color="primary">
		<ion-title>Pull Request</ion-title>
	</ion-navbar>
</ion-header>

<ion-content class="background-area">
	<ion-card class="card-info-type">
		<ion-card-content no-padding>
			<modal-header [ticket]="ticket"></modal-header>
			<modal-details [ticket]="ticket"></modal-details>
		</ion-card-content>
	</ion-card>

	<card-notes-photos-map-view [config]="config"></card-notes-photos-map-view>
</ion-content>

<ion-footer>
	<div class="footer-message">
		Would you like to request this vehicle?
		<span>Clicking submit will move this ticket into the Pull Tab and notify valet.</span>
	</div>
	<modal-footer
		[presentCancelConfirm]="false"
		(submit)="submit($event)"
		(cancel)="dismiss($event)">
	</modal-footer>
</ion-footer>
