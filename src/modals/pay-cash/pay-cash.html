<ion-header>
    <ion-navbar color="primary">
        <ion-buttons left>
            <button (click)="cancel(false);" ion-button icon-only>
                <ion-icon ios="ios-arrow-back" md="md-arrow-back"></ion-icon>Cancel
            </button>
        </ion-buttons>
        <ion-title>Cash Payment</ion-title>
    </ion-navbar>
</ion-header>

<ion-content>

    <!-- <h1>&#36;{{cashAmount}}</h1> -->
    <input #cashInput class="cash-input" (blur)="transformAmount($event)" [(ngModel)]="cashAmount" type="text"/>

    <div class="payment-input-wrapper" #paymentInfo>
        <ion-grid class="payment-info">
            <ion-row>
                <ion-col col-6>
                    <h4>Total</h4>
                </ion-col>

                <ion-col text-end col-6>
                    <h4>{{ ticket?.balance | currency }}</h4>
                </ion-col>
            </ion-row>

            <ion-row>
                <ion-col col-6>
                    <h4>Change</h4>
                </ion-col>

                <ion-col text-end col-6>
                    <h4>
                        {{ (cashAmountNumber - ticket?.balance) | abs | currency }}
                        <!-- {{ (cashAmountNumber - ticket?.balance) < 0 ? '-$' : '$' }}{{ (cashAmountNumber - ticket?.balance) | abs | currency : 'USD' }}
                        {{ ((cashAmountNumber - ticket?.balance) ) > 0 ? ' Back' : ' Missing' }} -->
                    </h4>
                </ion-col>
            </ion-row>

        </ion-grid>
    </div>

    <ion-digit-keyboard
        [align]="keyboardSettings.align"
        [width]="keyboardSettings.width"
        [visible]="keyboardSettings.visible"
        [leftActionOptions]="keyboardSettings.leftActionOptions"
        [rightActionOptions]="keyboardSettings.rightActionOptions"
        [roundButtons]="keyboardSettings.roundButtons"
        [showLetters]="keyboardSettings.showLetters"
        [swipeToHide]="keyboardSettings.swipeToHide"
        [theme]="keyboardSettings.theme"
        (buttonClick)="numberClick($event)"
    >
    </ion-digit-keyboard>
</ion-content>
